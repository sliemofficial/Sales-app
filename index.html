<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Installments">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Sales &amp; Installments</title>
<style>:root{--bg:#f4f6f8;--card:#fff;--ink:#14202b;--muted:#64748b;--line:#e2e8f0;--brand:#0f766e;--brand-ink:#fff;--bad:#dc2626;--good:#15803d;--warn:#d97706;--radius:14px;
  color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0b1117;--card:#151e27;--ink:#e6edf3;--muted:#8b9aab;--line:#243241;--brand:#2dd4bf;--brand-ink:#04211e;--bad:#f87171;--good:#4ade80;--warn:#fbbf24}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:none}
body{padding-top:env(safe-area-inset-top)}
a{color:inherit;text-decoration:none}
h1,h2{margin:0}
.page main{padding:12px 14px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.top{position:sticky;top:env(safe-area-inset-top);z-index:5;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line);max-width:100%}
.top h1{font-size:20px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync{font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);white-space:nowrap}
.icon{font-size:22px;background:none;border:0;color:var(--ink);padding:6px 10px;cursor:pointer}
.sec{font-size:15px;color:var(--muted);margin-top:8px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)}.small{font-size:13px}.good{color:var(--good)}.bad{color:var(--bad)}.struck{text-decoration:line-through;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.card h2{font-size:18px;margin-bottom:6px}
.k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:block}
.huge{font-size:28px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid.three{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;font:inherit;color:inherit;min-height:68px}
button.stat{cursor:pointer}.stat b{font-size:18px}.stat.wide{grid-column:1/-1}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-align:center}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.big{min-height:54px;font-size:17px}.btn.small{min-height:38px;padding:6px 12px;font-size:14px}
.btn:disabled,.btn.disabled{opacity:.5;pointer-events:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link{background:none;border:0;color:var(--brand);font:inherit;font-weight:600;padding:6px 0;cursor:pointer}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.row-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}.row-btns .btn{flex:1}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-size:34px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:6}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:11px;color:var(--muted)}
.tabbar a span{font-size:22px;line-height:1}.tabbar a.on{color:var(--brand);font-weight:700}
.search,input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:48px}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--brand)}
textarea{resize:vertical}
.field{display:flex;flex-direction:column;gap:4px}.lbl{font-size:13px;font-weight:600;color:var(--muted)}.hint{font-size:13px;color:var(--brand)}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.chips,.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips button,.tabs button{white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;min-height:40px}
.chips button.on,.tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:8px}.seg button{flex:1 1 auto;min-height:46px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.seg button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--line);white-space:nowrap}
.badge.overdue{background:#fee2e2;color:#b91c1c}.badge.active,.badge.paid,.badge.completed{background:#dcfce7;color:#166534}.badge.due_today{background:#ffedd5;color:#9a3412}
@media(prefers-color-scheme:dark){.badge.overdue{background:#450a0a;color:#fca5a5}.badge.active,.badge.paid,.badge.completed{background:#052e16;color:#86efac}.badge.due_today{background:#431407;color:#fdba74}}
.cust{position:relative;flex-direction:row;padding:0;overflow:hidden}
.cust.overdue{border-left:5px solid var(--bad)}
.card-main{flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.name{font-size:18px;overflow:hidden;text-overflow:ellipsis}
.call{display:flex;align-items:center;justify-content:center;width:64px;font-size:26px;border-left:1px solid var(--line)}
.late{color:var(--bad);font-weight:600}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer}
.line.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.line.voided{opacity:.7}.right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.hero{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sched{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}.sched.done{color:var(--muted)}.sched.late{color:var(--bad)}
.note .body{white-space:pre-wrap}.composer{display:flex;flex-direction:column;gap:8px;position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--bg);padding:6px 0}
.preview{background:var(--card);border:1px dashed var(--brand);border-radius:12px;padding:10px 12px;font-size:14px}
.error{background:#fee2e2;color:#991b1b;border-radius:12px;padding:10px 12px;font-weight:600}
.banner{background:#fef3c7;color:#92400e;padding:10px 14px;font-size:14px;position:sticky;top:0;z-index:20}
.empty{text-align:center;padding:28px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}.empty .big,.success .big{font-size:48px}.empty p{color:var(--muted);margin:0}
.success{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 0}
.menu{display:flex;justify-content:space-between;align-items:center;min-height:54px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);font:inherit;color:inherit;width:100%;text-align:left;cursor:pointer}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;max-height:90vh;overflow:auto}
.login main{padding-top:48px}.login .logo{font-size:56px;text-align:center}.login h1{text-align:center}.login p{text-align:center}.login form{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.small-huge{font-size:22px}.linkrow{background:none;border:0;color:inherit;font:inherit;padding:0;cursor:pointer;width:100%;text-align:left}
.detail{display:flex;flex-direction:column;gap:6px;margin-top:6px}.detail hr{border:0;border-top:1px dashed var(--line);width:100%;margin:2px 0}
.lineitem{border-left:4px solid var(--brand)}
.calcout{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:12px;padding:10px 12px}
.viewer{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.viewer .top{position:static}.viewer-body{flex:1;min-height:0;background:#888}.viewer-body iframe{width:100%;height:100%;border:0;background:#fff}
.viewer-bar{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}.viewer-bar .btn{flex:1}
.center{text-align:center;margin:6px 0}
.lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.dots{display:flex;gap:16px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--brand)}.dots i.on{background:var(--brand)}
.dots.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}.pad button{height:76px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 28px inherit;cursor:pointer}
.pad button:active{background:var(--brand);color:var(--brand-ink)}.pad .ghost{border:0;background:none;font-size:15px}
.lock-forgot{position:fixed;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom));z-index:201;text-align:center}
.warnbox{border-color:var(--bad)}
.lock-bio{position:fixed;left:24px;right:24px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:201}

.badge.written_off{background:#fee2e2;color:#b91c1c}.badge.returned{background:#e0e7ff;color:#3730a3}
@media(prefers-color-scheme:dark){.badge.written_off{background:#450a0a;color:#fca5a5}.badge.returned{background:#1e1b4b;color:#c7d2fe}}
.stepper{display:flex;align-items:center;gap:10px}.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card,transparent);font-size:20px;color:inherit}.stepper b{min-width:22px;text-align:center}
.modal>*{flex-shrink:0}
</style>
</head>
